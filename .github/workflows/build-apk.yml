name: Build APK PAINEL SANTOS

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: painel-santos-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Package source and APK
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/
          zip -qr PAINEL-SANTOS-FINAL.zip . -x '.git/*' '.gradle/*' 'release/*'
          zip -q PAINEL-SANTOS-FINAL.zip release/app-debug.apk

      - name: Upload final ZIP
        uses: actions/upload-artifact@v4
        with:
          name: painel-santos-final-zip
          path: PAINEL-SANTOS-FINAL.zip
          if-no-files-found: error
